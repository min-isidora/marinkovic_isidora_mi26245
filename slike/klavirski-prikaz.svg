<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img">
  <title>Klavirski prikaz nota</title>
  <rect width="800" height="320" fill="#061218"/>
  <!-- horizontalne linije visina -->
  <g stroke="#1c4f57" stroke-width="1">
    <line x1="70" y1="40" x2="780" y2="40"/>
    <line x1="70" y1="90" x2="780" y2="90"/>
    <line x1="70" y1="140" x2="780" y2="140"/>
    <line x1="70" y1="190" x2="780" y2="190"/>
    <line x1="70" y1="240" x2="780" y2="240"/>
    <line x1="70" y1="290" x2="780" y2="290"/>
  </g>
  <!-- oznake nota -->
  <g fill="#9ff0e8" font-family="Verdana, sans-serif" font-size="14">
    <text x="20" y="64">E5</text>
    <text x="20" y="114">D5</text>
    <text x="20" y="164">C5</text>
    <text x="20" y="214">B4</text>
    <text x="20" y="264">A4</text>
  </g>
  <!-- note: svaka traka nosi slog -->
  <g font-family="Verdana, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    <rect x="90"  y="222" width="100" height="36" rx="8" fill="#39c5bb"/>
    <text x="140" y="246" fill="#061218">ha</text>
    <rect x="210" y="172" width="100" height="36" rx="8" fill="#39c5bb"/>
    <text x="260" y="196" fill="#061218">tsu</text>
    <rect x="330" y="122" width="100" height="36" rx="8" fill="#39c5bb"/>
    <text x="380" y="146" fill="#061218">ne</text>
    <rect x="450" y="72"  width="100" height="36" rx="8" fill="#ff7eb6"/>
    <text x="500" y="96"  fill="#061218">mi</text>
    <rect x="570" y="122" width="190" height="36" rx="8" fill="#ff7eb6"/>
    <text x="665" y="146" fill="#061218">ku</text>
  </g>
  <text x="400" y="312" fill="#9ff0e8" font-family="Verdana, sans-serif" font-size="13" text-anchor="middle">vreme →</text>
</svg>
