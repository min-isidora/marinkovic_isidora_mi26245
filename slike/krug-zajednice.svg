<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img">
  <title>Krug zajednice</title>
  <defs>
    <marker id="strelica" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff7eb6"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#061218"/>
  <g font-family="Verdana, sans-serif" font-size="14" font-weight="bold" fill="#061218" text-anchor="middle">
    <!-- gore -->
    <rect x="290" y="20" width="220" height="70" rx="12" fill="#39c5bb"/>
    <text x="400" y="52">1. Kompozitor piše</text>
    <text x="400" y="72">pesmu</text>
    <!-- desno -->
    <rect x="560" y="175" width="220" height="70" rx="12" fill="#39c5bb"/>
    <text x="670" y="207">2. Objavljuje je</text>
    <text x="670" y="227">na internetu</text>
    <!-- dole -->
    <rect x="290" y="330" width="220" height="70" rx="12" fill="#ff7eb6"/>
    <text x="400" y="362">3. Obožavatelji prave</text>
    <text x="400" y="382">crteže i spotove</text>
    <!-- levo -->
    <rect x="20" y="175" width="220" height="70" rx="12" fill="#ff7eb6"/>
    <text x="130" y="207">4. Nova publika</text>
    <text x="130" y="227">piše nove pesme</text>
  </g>
  <g stroke="#ff7eb6" stroke-width="3" fill="none" marker-end="url(#strelica)">
    <path d="M515 70 Q 620 80 640 170"/>
    <path d="M640 250 Q 620 340 515 355"/>
    <path d="M285 355 Q 180 340 160 250"/>
    <path d="M160 170 Q 180 80 285 70"/>
  </g>
</svg>
